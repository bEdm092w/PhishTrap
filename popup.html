<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; font-family: system-ui, sans-serif; padding: 18px; margin: 0; }
    h2 { font-size: 18px; margin: 0 0 14px; color: #111827; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: #374151; }
    input { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 16px; width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .status { font-size: 12px; color: #16a34a; margin-top: 8px; height: 14px; font-weight: 600; text-align: center; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <h2>🛡️ Guardian PhishGuard</h2>
  <label for="apiKey">Google Safe Browsing API Key</label>
  <input id="apiKey" type="text" placeholder="AIzaSy..." />
  <div class="hint">Free key from console.cloud.google.com</div>

  <label for="trustedContact">Trusted Contact Phone Number</label>
  <input id="trustedContact" type="tel" placeholder="+1 555 019 2834" />

  <button id="save">Save Settings</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
